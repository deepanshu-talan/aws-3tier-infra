name: Terraform Plan and Apply

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

env:
  TF_WORKING_DIR: terraform-infra/environments/dev
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_hosted_zone_name: ${{ vars.HOSTED_ZONE_NAME }}
  TF_VAR_app_domain_name: ${{ vars.APP_DOMAIN_NAME }}
  TF_VAR_terraform_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_alarm_notification_email: ${{ secrets.ALARM_NOTIFICATION_EMAIL }}
  TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
  TF_VAR_dockerhub_password: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  terraform-plan:
    name: Terraform Plan
    environment: dev
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set deployment image tags
        run: |
          echo "FRONTEND_IMAGE_TAG=${{ secrets.DOCKERHUB_USERNAME }}/goal-tracker-frontend:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE_TAG=${{ secrets.DOCKERHUB_USERNAME }}/goal-tracker-backend:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          echo "TF_VAR_frontend_docker_image=${{ secrets.DOCKERHUB_USERNAME }}/goal-tracker-frontend:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          echo "TF_VAR_backend_docker_image=${{ secrets.DOCKERHUB_USERNAME }}/goal-tracker-backend:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false \
            -backend-config=backend.hcl \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -out=tfplan

      - name: Upload saved Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          if-no-files-found: error

  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set deployment image tags
        run: |
          echo "FRONTEND_IMAGE_TAG=${{ secrets.DOCKERHUB_USERNAME }}/goal-tracker-frontend:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE_TAG=${{ secrets.DOCKERHUB_USERNAME }}/goal-tracker-backend:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          echo "TF_VAR_frontend_docker_image=${{ secrets.DOCKERHUB_USERNAME }}/goal-tracker-frontend:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          echo "TF_VAR_backend_docker_image=${{ secrets.DOCKERHUB_USERNAME }}/goal-tracker-backend:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"

      - name: Download saved Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false \
            -backend-config=backend.hcl \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform apply saved plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false tfplan
    
  deploy-application:
    name: Deploy Application
    needs: terraform-apply
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set deployment image tags
        run: |
          echo "FRONTEND_IMAGE_TAG=${{ secrets.DOCKERHUB_USERNAME }}/goal-tracker-frontend:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE_TAG=${{ secrets.DOCKERHUB_USERNAME }}/goal-tracker-backend:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
        
      - name: Install deployment dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl unzip

          if ! command -v aws >/dev/null 2>&1; then
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
              -o "/tmp/awscliv2.zip"

            unzip -q /tmp/awscliv2.zip -d /tmp

            sudo /tmp/aws/install
          fi

          aws --version
          jq --version
          curl --version
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false \
            -backend-config=backend.hcl \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          
      - name: Deploy application via SSM
        env:
          FRONTEND_IMAGE_TAG: ${{ env.FRONTEND_IMAGE_TAG }}
          BACKEND_IMAGE_TAG: ${{ env.BACKEND_IMAGE_TAG }}
        run: bash terraform-infra/scripts/deploy-application-ssm.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false \
            -backend-config=backend.hcl \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Post-deployment verification
        env:
          APP_DOMAIN_NAME: ${{ vars.APP_DOMAIN_NAME }}
        run: |
          set -euo pipefail

          cd "$TF_WORKING_DIR"

          echo "============================================================"
          echo "Post-deployment verification"
          echo "============================================================"

          if [ -n "${APP_DOMAIN_NAME}" ]; then
            FRONTEND_URL="https://${APP_DOMAIN_NAME}"
          else
            FRONTEND_URL="$(terraform output -raw application_url)"
          fi

          echo "Frontend URL: ${FRONTEND_URL}"

          for attempt in $(seq 1 20); do
            echo "Checking frontend... attempt ${attempt}/20"

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 15 \
              "${FRONTEND_URL}" \
              > /dev/null; then

              echo "Frontend public endpoint is healthy."
              break
            fi

            if [ "${attempt}" -eq 20 ]; then
              echo "ERROR: Frontend verification failed at ${FRONTEND_URL}"
              exit 1
            fi

            sleep 15
          done

          FRONTEND_ASG="$(terraform output -raw frontend_asg_name)"
          BACKEND_ASG="$(terraform output -raw backend_asg_name)"

          echo "Frontend ASG: ${FRONTEND_ASG}"
          echo "Backend ASG: ${BACKEND_ASG}"

          verify_service_on_asg() {
            local asg_name="$1"
            local service_name="$2"
            local health_url="$3"

            local instance_ids
            local command_id
            local commands_file
            local parameters_file

            echo ""
            echo "------------------------------------------------------------"
            echo "Verifying ${service_name}"
            echo "ASG: ${asg_name}"
            echo "Health URL: ${health_url}"
            echo "------------------------------------------------------------"

            instance_ids="$(
              aws autoscaling describe-auto-scaling-groups \
                --auto-scaling-group-names "${asg_name}" \
                --region "${AWS_REGION}" \
                --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
                --output text
            )"

            if [ -z "${instance_ids}" ] || [ "${instance_ids}" = "None" ]; then
              echo "ERROR: No InService instances found for ${asg_name}"
              return 1
            fi

            echo "Instances: ${instance_ids}"

            commands_file="$(mktemp)"
            parameters_file="$(mktemp)"

            cat > "${commands_file}" <<EOF
          set -eu

          echo "Checking Docker container..."

          if ! docker ps --format '{{.Names}}' | grep -Fxq '${service_name}'; then
            echo "ERROR: ${service_name} container is not running."
            docker ps -a
            docker logs '${service_name}' || true
            exit 1
          fi

          echo "Container ${service_name} is running."

          echo "Checking application endpoint..."

          if ! curl --fail --silent --show-error --max-time 15 '${health_url}' > /dev/null; then
            echo "ERROR: ${service_name} health check failed."
            docker logs '${service_name}' || true
            exit 1
          fi

          echo "${service_name} verification successful."
          EOF

            jq -n \
              --rawfile commands "${commands_file}" \
              '{
                commands: (
                  $commands
                  | split("\n")
                  | map(select(length > 0))
                )
              }' \
              > "${parameters_file}"

            echo "Sending verification command..."

            command_id="$(
              aws ssm send-command \
                --document-name "AWS-RunShellScript" \
                --comment "Verify ${service_name} deployment" \
                --instance-ids ${instance_ids} \
                --parameters "file://${parameters_file}" \
                --region "${AWS_REGION}" \
                --query "Command.CommandId" \
                --output text
            )"

            rm -f "${commands_file}" "${parameters_file}"

            echo "Verification SSM command: ${command_id}"

            local failed=0

            for instance_id in ${instance_ids}; do
              echo ""
              echo "Waiting for ${instance_id}..."

              if aws ssm wait command-executed \
                --command-id "${command_id}" \
                --instance-id "${instance_id}" \
                --region "${AWS_REGION}"; then

                echo "Verification passed on ${instance_id}"

                aws ssm get-command-invocation \
                  --command-id "${command_id}" \
                  --instance-id "${instance_id}" \
                  --region "${AWS_REGION}" \
                  --query "StandardOutputContent" \
                  --output text || true

              else
                echo "ERROR: Verification failed on ${instance_id}"

                aws ssm get-command-invocation \
                  --command-id "${command_id}" \
                  --instance-id "${instance_id}" \
                  --region "${AWS_REGION}" \
                  --query '{
                    Status: Status,
                    StatusDetails: StatusDetails,
                    Output: StandardOutputContent,
                    Error: StandardErrorContent
                  }' \
                  --output json || true

                failed=1
              fi
            done

            if [ "${failed}" -ne 0 ]; then
              return 1
            fi
          }

          verify_service_on_asg \
            "${FRONTEND_ASG}" \
            "goal-tracker-frontend" \
            "http://localhost:3000/"

          verify_service_on_asg \
            "${BACKEND_ASG}" \
            "goal-tracker-backend" \
            "http://localhost:8080/goals"

          echo ""
          echo "============================================================"
          echo "POST-DEPLOYMENT VERIFICATION SUCCESSFUL"
          echo "============================================================"