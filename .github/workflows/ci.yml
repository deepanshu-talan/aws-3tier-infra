name: Application CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  application-tests:
    name: Backend & Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Backend
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: app/backend/go.sum

      - name: Run backend tests
        working-directory: app/backend
        run: go test ./...

      # Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Frontend syntax check
        working-directory: app/frontend
        run: node --check server.js

      - name: Frontend smoke test
        working-directory: app/frontend
        run: |
          node server.js &
          SERVER_PID=$!

          trap 'kill $SERVER_PID' EXIT

          for i in {1..10}; do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:3000/; then
              exit 0
            fi
            sleep 2
          done

          echo "Frontend failed to respond"
          exit 1

      # Docker build validation
      - name: Build frontend Docker image
        run: docker build -t frontend-ci:${{ github.sha }} ./app/frontend

      - name: Build backend Docker image
        run: docker build -t backend-ci:${{ github.sha }} ./app/backend
